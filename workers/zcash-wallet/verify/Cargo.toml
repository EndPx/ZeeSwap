[package]
name = "zeeswap-g1-verify"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
zcash_client_backend = { version = "=0.25.0-pre.1", features = ["orchard"] }
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard", "sapling"] }
zcash_primitives = "=0.31.0-pre.1"
zcash_protocol = "=0.11.0-pre.0"

[profile.dev]
debug = 0
incremental = false

[[bin]]
name = "zeeswap-wallet-read"
path = "src/read.rs"
