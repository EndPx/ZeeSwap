# Install as a NEW site only after checking nginx -T for hostname conflicts.
# This is the HTTP bootstrap. Replace it with the TLS site after certificate issue.
server {
    listen 80;
    listen [::]:80;
    server_name zeeswap.endpx.cloud;
    root /opt/zeeswap-testnet/current/app/apps/web/dist;
    location ^~ /.well-known/acme-challenge/ { root /opt/zeeswap-testnet/acme; }
    location / { return 503; }
}
