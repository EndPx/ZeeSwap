# This file is included in the http context. Error responses never get immutable caching.
map $status $zeeswap_asset_cache_control {
    default "no-store";
    ~^2[0-9][0-9]$ "public, max-age=31536000, immutable";
}
server {
    listen 80;
    listen [::]:80;
    server_name zeeswap.endpx.cloud;
    location ^~ /.well-known/acme-challenge/ { root /opt/zeeswap-testnet/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zeeswap.endpx.cloud;
    ssl_certificate /etc/letsencrypt/live/zeeswap.endpx.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zeeswap.endpx.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/zeeswap-testnet/current/app/apps/web/dist;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # No wallet addresses, order IDs, request bodies or query strings in access logs.
    access_log off;
    location = /health { proxy_pass http://127.0.0.1:3031; include /etc/nginx/proxy_params; }
    # Public Main swap writes only; backend authentication/admission still applies.
    location ~ ^/v1/(quotes$|orders/[0-9a-f-]+/(accept|funding)$) {
        limit_except GET HEAD POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_no_cache 1;
        add_header Cache-Control no-store always;
    }
    # Keep other writes, including Bridge routes, restricted to loopback.
    location /v1/ {
        limit_except GET HEAD { allow 127.0.0.1; allow ::1; deny all; }
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_no_cache 1;
        add_header Cache-Control no-store always;
    }
    location ~ /\. { deny all; }
    # Retain reviewed assets from earlier releases for browsers with cached HTML.
    location ^~ /assets/ {
        root /opt/zeeswap-testnet/web-asset-store;
        try_files $uri =404;
        add_header Cache-Control $zeeswap_asset_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }
    location = /index.html {
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }
}
