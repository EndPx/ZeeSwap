# Bootstrap is reachable only through the container's Unix socket by Root's tools.
local all zeeswap_migration_bootstrap trust
local all all reject
# Published host socket is loopback-only; every TCP authentication requires TLS.
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
