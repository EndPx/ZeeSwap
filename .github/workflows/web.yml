name: Web local acceptance

on:
  push:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_DISABLE_REACT_DEVTOOLS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.21.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zeeswap/web typecheck
      - run: pnpm web:test
      - run: pnpm web:build
      - run: pnpm --filter @zeeswap/web exec playwright install --with-deps chromium
      - run: pnpm --filter @zeeswap/web test:ui
