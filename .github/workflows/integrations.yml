name: Local integration models
on:
  push:
    paths: ['api/**', 'indexers/envio/**', 'indexers/zeer/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/integrations.yml']
  pull_request:
    paths: ['api/**', 'indexers/envio/**', 'indexers/zeer/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/integrations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.21.0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Fixtures and local mock transports only. test:integration is a separate live DB command.
      - run: pnpm test:integration:local
      # Install pinned Chef privately scoped tooling, then exercise its actual local HTTP/cursor contract.
      # No project migration, scanner, service follow loop or external database is started.
      - run: npm ci --ignore-scripts
        working-directory: indexers/zeer
      - run: npm run typecheck
        working-directory: indexers/zeer
      - run: npm test
        working-directory: indexers/zeer
      # Generate and type-check prepared indexer sources; never start indexing/deployment.
      - run: pnpm install --frozen-lockfile
        working-directory: indexers/envio
      - run: pnpm validate
        working-directory: indexers/envio
